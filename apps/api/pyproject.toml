[project]
name = "knowflow-api"
version = "0.1.0"
description = "KnowFlow backend: local-first knowledge intelligence API"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6,<3",
    "sqlalchemy>=2.0.36,<2.1",
    "psycopg[binary]>=3.2,<4",
    "httpx>=0.28,<1",
    "alembic>=1.14,<2",
    "python-multipart>=0.0.20",
    "pypdf>=5.1,<7",
    "python-docx>=1.1,<2",
    "pgvector>=0.3.6,<0.5",
]

[project.optional-dependencies]
# Optional local CrossEncoder reranker (TRD §4.2). Heavy: torch CPU + ~2.3 GB of weights.
reranker = [
    "sentence-transformers>=3.3,<6",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.8",
    "mypy>=1.13",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "N", "S", "SIM", "RUF", "ASYNC"]
ignore = []

[tool.ruff.lint.isort]
# The local alembic/ migrations folder must not make the `alembic` package look first-party.
known-third-party = ["alembic"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
plugins = ["pydantic.mypy"]
packages = ["app"]

[[tool.mypy.overrides]]
module = ["pgvector.*", "sentence_transformers.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "integration: requires a running PostgreSQL (KNOWFLOW_RUN_INTEGRATION=1)",
    "ollama: calls real local models through Ollama (KNOWFLOW_RUN_OLLAMA=1)",
]
addopts = "-ra --strict-markers"
